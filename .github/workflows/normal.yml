name: Weekly

on:
  workflow_dispatch:
  schedule:
    - cron: '5 3 * * 0'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix_combinations: ${{ steps.set-matrix.outputs.matrix_combinations }}
      timestamp: ${{ steps.ts.outputs.TIME }}
      date: ${{ steps.ts.outputs.DATE }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate dynamic job combinations from JSON
        id: set-matrix
        run: |
          CONFIG_FILE="devices/weekly.json"
          MATRIX_JSON=$(jq -c '[to_entries[] | .key as $build | .value.build_flags | (if (.ksu_type | type) == "array" then .ksu_type[] else .ksu_type end) as $ksu | { "build_type": $build, "ksu_type": $ksu }]' "$CONFIG_FILE")
          echo "matrix_combinations=$MATRIX_JSON" >> $GITHUB_OUTPUT

      - name: Timestamp
        id: ts
        run: |
          DATE=$(date +'%Y%m%d')
          TIME=$(date +'%s')
          echo "DATE=$DATE" >> $GITHUB_OUTPUT
          echo "TIME=$TIME" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix_combinations) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          echo "- Uninstalling firefox and google-chrome..."
          sudo apt purge -y firefox google-chrome-stable
          echo "- Changing packages source into official ubuntu instead of azure..."
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt
          fi
          sudo find /etc/apt/ -type f \( -name "*.list" -o -name "*.sources" \) -exec sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' {} +
          echo "- Fetching update database..."
          sudo apt-get update
          echo "- Installing update package..."
          sudo apt-get upgrade -y
          echo "- Installing needed packages..."
          sudo apt-get install -y \
            bc build-essential bison flex zip p7zip-full \
            libc6 curl libstdc++6 git wget libssl-dev zstd \
            lld python3 patchutils ccache libc6-dev

      - name: Preparing kernel sources
        run: |
          BUILD_TYPE="${{ matrix.build_type }}"
          CONFIG_FILE="devices/weekly.json"
          DIR=$(jq -r --arg target "$BUILD_TYPE" '.[$target].dir // empty' "$CONFIG_FILE")

          if [ -z "$DIR" ]; then
            echo "::error::Invalid build type: $BUILD_TYPE"
            exit 1
          fi

          rm -rf "$DIR"

          jq -c --arg target "$BUILD_TYPE" '.[$target].sources[]' "$CONFIG_FILE" | while read -r item; do
            REPO=$(echo "$item" | jq -r '.repo')
            BRANCH=$(echo "$item" | jq -r '.branch')
            SUB_PATH=$(echo "$item" | jq -r '.path // "."')

            DEST="$DIR"
            [ "$SUB_PATH" != "." ] && DEST="$DIR/$SUB_PATH"

            echo "Cloning $REPO ($BRANCH) -> $DEST"
            git clone "$REPO" -b "$BRANCH" "$DEST"
          done

          echo "Copying buildscript and config..."
          cp build.sh "$DIR"/
          cp "$CONFIG_FILE" "$DIR/devices.json"
          cp -r scripts "$DIR"/
          chmod +x ./"$DIR"/build.sh

      - name: Compile the kernel
        run: |
          BUILD_TYPE="${{ matrix.build_type }}"
          KSU_TYPE="${{ matrix.ksu_type }}"
          CONFIG_FILE="devices/weekly.json"
          DIR=$(jq -r --arg target "$BUILD_TYPE" '.[$target].dir' "$CONFIG_FILE")
          
          # Pull the rest of the standard build flags from JSON
          BBG=$(jq -r --arg target "$BUILD_TYPE" '.[$target].build_flags.bbg_type // empty' "$CONFIG_FILE")
          NOMOUNT=$(jq -r --arg target "$BUILD_TYPE" '.[$target].build_flags.nomount_type // empty' "$CONFIG_FILE")
          DROIDSPACES=$(jq -r --arg target "$BUILD_TYPE" '.[$target].build_flags.droidspaces_type // empty' "$CONFIG_FILE")
          REKERNEL=$(jq -r --arg target "$BUILD_TYPE" '.[$target].build_flags.rekernel_type // empty' "$CONFIG_FILE")

          echo "Starting compile in $DIR for $BUILD_TYPE with KSU: $KSU_TYPE..."
          cd "$DIR"
          ./build.sh $BUILD_TYPE $KSU_TYPE $BBG $NOMOUNT $DROIDSPACES $REKERNEL

      - name: Preparing AnyKernel3 sources
        run: |
          BUILD_TYPE="${{ matrix.build_type }}"
          CONFIG_FILE="devices/weekly.json"
          DIR=$(jq -r --arg target "$BUILD_TYPE" '.[$target].dir' "$CONFIG_FILE")
          IMAGE=$(jq -r --arg target "$BUILD_TYPE" '.[$target].image' "$CONFIG_FILE")
          DTB=$(jq -r --arg target "$BUILD_TYPE" '.[$target].dtb // empty' "$CONFIG_FILE")
          DTBO=$(jq -r --arg target "$BUILD_TYPE" '.[$target].dtbo // empty' "$CONFIG_FILE")
          VERSIONS=$(jq -r --arg target "$BUILD_TYPE" '.[$target].supported_versions' "$CONFIG_FILE")
          BANNER=$(jq -r --arg target "$BUILD_TYPE" '.[$target].banner' "$CONFIG_FILE")

          DEV_NAMES_FORMATTED=$(jq -r --arg target "$BUILD_TYPE" '.[$target].device_names | to_entries[] | "device.name" + ((.key + 1)|tostring) + "=" + .value' "$CONFIG_FILE")

          rm -rf AnyKernel3
          git clone https://github.com/riarumoda/AnyKernel3 AnyKernel3 --depth=1

          cp "$DIR/out/arch/arm64/boot/$IMAGE" AnyKernel3/

          if [ -n "$DTB" ] && [ -f "$DIR/out/arch/arm64/boot/$DTB" ]; then
            echo "Copying DTB image: $DTB"
            cp "$DIR/out/arch/arm64/boot/$DTB" AnyKernel3/
          fi

          if [ -n "$DTBO" ] && [ -f "$DIR/out/arch/arm64/boot/$DTBO" ]; then
            echo "Copying DTBO image: $DTBO"
            cp "$DIR/out/arch/arm64/boot/$DTBO" AnyKernel3/
          fi

          sed -i "s/supported.versions=11-16/supported.versions=$VERSIONS/" AnyKernel3/anykernel.sh

          sed -i '/device.name[0-9]=/d' AnyKernel3/anykernel.sh
          awk -v dev="$DEV_NAMES_FORMATTED" '/supported.versions=/ {print dev} {print}' AnyKernel3/anykernel.sh > AnyKernel3/anykernel.sh.tmp && mv AnyKernel3/anykernel.sh.tmp AnyKernel3/anykernel.sh

          sed -i "s/sweet (sm6150)/$BANNER/g" AnyKernel3/banner
          sed -i 's/KERNEL_BUILD_TYPE="Weekly"/KERNEL_BUILD_TYPE="Weekly"/' AnyKernel3/anykernel.sh

      - name: Pack kernel with AnyKernel3
        run: |
          BUILD_TYPE="${{ matrix.build_type }}"
          KSU_TYPE="${{ matrix.ksu_type }}"
          CONFIG_FILE="devices/weekly.json"
          ZIP_PREFIX=$(jq -r --arg target "$BUILD_TYPE" '.[$target].zip_prefix' "$CONFIG_FILE")
          ZIPNAME="${ZIP_PREFIX}-${KSU_TYPE}-${{ needs.setup.outputs.date }}.zip"

          cd AnyKernel3
          zip -rq9 "../$ZIPNAME" ./*
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build_type }}-${{ matrix.ksu_type }}
          path: |
            *.zip

  release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded zips
        run: ls -lah artifacts

      - name: Timestamp
        id: ts
        run: |
          FANCYDATE=$(date +'%Y/%m/%d')
          echo "FANCYDATE=$FANCYDATE" >> $GITHUB_OUTPUT

      - name: Create Release and Upload builds
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: kernel-weekly-${{ needs.setup.outputs.timestamp }}
          name: Weekly - ${{ steps.ts.outputs.FANCYDATE }}
          draft: false
          prerelease: false
          body: |
            > [!NOTE]   
            > - The kernel supports Android 15 to 16.   
            > - ReSukiSU latest manager can be found in [here](https://resukisu.github.io/guide/install.html#Get-manager).    
               
            > [!IMPORTANT]
            > - The feature set can be seen in [here](https://github.com/riarumoda/perf_neon-builder#features).     

            > [!CAUTION]   
            > - Always backup your boot and dtbo image first before proceeding!   
          files: |
            artifacts/**/*.zip
          overwrite_files: true