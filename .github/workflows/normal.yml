name: Weekly

on:
  workflow_dispatch:
  schedule:
    - cron: '5 3 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.ts.outputs.TIME }}
      date: ${{ steps.ts.outputs.DATE }}
    strategy:
      matrix:
        build-type: [sweet, davinci, tucana, violet, ginkgo, laurel_sprout, gta4l]
        ksu-type: [zako-susfs]
        bbg-type: [bbg]
        nomount-type: [nomount]
        droidspaces-type: [droidspaces]
        rekernel-type: [rekernel]

    steps:
      - uses: actions/checkout@v6

      - name: Timestamp
        id: ts
        run: |
          DATE=$(date +'%Y%m%d')
          TIME=$(date +'%s')
          echo "DATE=$DATE" >> $GITHUB_OUTPUT
          echo "TIME=$TIME" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential bison flex zip p7zip-full \
            libc6 curl libstdc++6 git wget libssl-dev zstd \
            lld python3 patchutils ccache

      - name: Preparing kernel sources
        run: |
          BUILD_TYPE="${{ matrix.build-type }}"
          CONFIG_FILE="devices/weekly.json"
          DIR=$(jq -r --arg target "$BUILD_TYPE" '.[$target].dir // empty' "$CONFIG_FILE")

          if [ -z "$DIR" ]; then
            echo "::error::Invalid build type: $BUILD_TYPE"
            exit 1
          fi

          rm -rf "$DIR"

          jq -c --arg target "$BUILD_TYPE" '.[$target].sources[]' "$CONFIG_FILE" | while read -r item; do
            REPO=$(echo "$item" | jq -r '.repo')
            BRANCH=$(echo "$item" | jq -r '.branch')
            SUB_PATH=$(echo "$item" | jq -r '.path // "."')

            DEST="$DIR"
            [ "$SUB_PATH" != "." ] && DEST="$DIR/$SUB_PATH"

            echo "Cloning $REPO ($BRANCH) -> $DEST"
            git clone "$REPO" --depth=1 -b "$BRANCH" "$DEST"
          done

          echo "Copying buildscript and config..."
          cp build.sh "$DIR"/
          cp "$CONFIG_FILE" "$DIR/devices.json"
          cp -r scripts "$DIR"/
          chmod +x ./"$DIR"/build.sh

      - name: Compile the kernel
        run: |
          BUILD_TYPE="${{ matrix.build-type }}"
          CONFIG_FILE="devices/weekly.json"
          DIR=$(jq -r --arg target "$BUILD_TYPE" '.[$target].dir' "$CONFIG_FILE")

          echo "Starting to compile in $DIR..."
          cd "$DIR"
          ./build.sh ${{ matrix.build-type }} ${{ matrix.ksu-type }} ${{ matrix.bbg-type }} ${{ matrix.nomount-type }} ${{ matrix.droidspaces-type }} ${{ matrix.rekernel-type }}

      - name: Preparing AnyKernel3 sources
        run: |
          BUILD_TYPE="${{ matrix.build-type }}"
          CONFIG_FILE="devices/weekly.json"
          DIR=$(jq -r --arg target "$BUILD_TYPE" '.[$target].dir' "$CONFIG_FILE")
          IMAGE=$(jq -r --arg target "$BUILD_TYPE" '.[$target].image' "$CONFIG_FILE")
          DTB=$(jq -r --arg target "$BUILD_TYPE" '.[$target].dtb // empty' "$CONFIG_FILE")
          DTBO=$(jq -r --arg target "$BUILD_TYPE" '.[$target].dtbo // empty' "$CONFIG_FILE")
          VERSIONS=$(jq -r --arg target "$BUILD_TYPE" '.[$target].supported_versions' "$CONFIG_FILE")
          BANNER=$(jq -r --arg target "$BUILD_TYPE" '.[$target].banner' "$CONFIG_FILE")

          DEV_NAMES_FORMATTED=$(jq -r --arg target "$BUILD_TYPE" '.[$target].device_names | to_entries[] | "device.name" + ((.key + 1)|tostring) + "=" + .value' "$CONFIG_FILE")

          rm -rf AnyKernel3
          git clone https://github.com/riarumoda/AnyKernel3 AnyKernel3 --depth=1

          cp "$DIR/out/arch/arm64/boot/$IMAGE" AnyKernel3/

          if [ -n "$DTB" ] && [ -f "$DIR/out/arch/arm64/boot/$DTB" ]; then
            echo "Copying DTB image: $DTB"
            cp "$DIR/out/arch/arm64/boot/$DTB" AnyKernel3/
          fi

          if [ -n "$DTBO" ] && [ -f "$DIR/out/arch/arm64/boot/$DTBO" ]; then
            echo "Copying DTBO image: $DTBO"
            cp "$DIR/out/arch/arm64/boot/$DTBO" AnyKernel3/
          fi

          sed -i "s/supported.versions=11-16/supported.versions=$VERSIONS/" AnyKernel3/anykernel.sh

          sed -i '/device.name[0-9]=/d' AnyKernel3/anykernel.sh
          awk -v dev="$DEV_NAMES_FORMATTED" '/supported.versions=/ {print dev} {print}' AnyKernel3/anykernel.sh > AnyKernel3/anykernel.sh.tmp && mv AnyKernel3/anykernel.sh.tmp AnyKernel3/anykernel.sh

          sed -i "s/sweet (sm6150)/$BANNER/g" AnyKernel3/banner
          sed -i 's/KERNEL_BUILD_TYPE="Weekly"/KERNEL_BUILD_TYPE="Weekly"/' AnyKernel3/anykernel.sh

      - name: Pack kernel with AnyKernel3
        run: |
          BUILD_TYPE="${{ matrix.build-type }}"
          CONFIG_FILE="devices/weekly.json"

          ZIP_PREFIX=$(jq -r --arg target "$BUILD_TYPE" '.[$target].zip_prefix' "$CONFIG_FILE")
          ZIPNAME="${ZIP_PREFIX}-${{ steps.ts.outputs.DATE }}.zip"

          cd AnyKernel3
          zip -rq9 "../$ZIPNAME" ./*
          cd ..

      - name: Upload artifacts (All builds)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.build-type }}
          path: |
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded zips
        run: ls -lah artifacts

      - name: Timestamp
        id: ts
        run: |
          FANCYDATE=$(date +'%Y/%m/%d')
          echo "FANCYDATE=$FANCYDATE" >> $GITHUB_OUTPUT

      - name: Create Release and Upload builds
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: kernel-weekly-${{ needs.build.outputs.timestamp }}
          name: Weekly - ${{ steps.ts.outputs.FANCYDATE }}
          draft: false
          prerelease: false
          body: |
            > [!NOTE]   
            > - The kernel supports Android 15 to 16.   
            > - ReSukiSU latest manager can be found in [here](https://resukisu.github.io/guide/install.html#Get-manager).    
               
            > [!IMPORTANT]
            > - The feature set can be seen in [here](https://github.com/riarumoda/perf_neon-builder#features).     

            > [!CAUTION]   
            > - Always backup your boot and dtbo image first before proceeding!   
          files: |
            artifacts/**/*.zip
          overwrite_files: true
